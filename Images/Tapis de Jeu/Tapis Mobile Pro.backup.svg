      <stop offset=".48" stop-color="#08070c" stop-opacity=".72"/>
      <stop offset="1" stop-color="#020205" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".62"/>
