<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" preserveAspectRatio="none"
     role="img" aria-labelledby="titre desc">
<title id="titre">Tapis mobile Spellaho</title>
<desc id="desc">Tapis fantasy pour smartphone en paysage : deux camps, tablettes de créatures, terrains, cimetières, bibliothèques et portails de commandant.</desc>
<!--
  ============================================================================
  Spellaho — tapis mobile (téléphone en paysage)
  ============================================================================
  RÔLE : fond appliqué en background-image sur .board-stage (vue mobile
  « board »). Le jeu dessine PAR-DESSUS : compteurs, dos de cartes, portraits,
  créatures, terrains, main et boutons.

  GÉOMÉTRIE — relevée dans le DOM, PARTIE LANCÉE.
  Piège à connaître : les règles de mise en page sont conditionnées à
  `body.game-running[data-mobile-view="board"]`. Mesurer depuis le menu donne
  une TOUTE AUTRE disposition (bibliothèque à gauche, commandant à droite) et
  conduit à un tapis désaligné. Les valeurs ci-dessous ont été relevées en
  partie, puis confirmées stables sur trois relevés successifs.

  Coordonnées en unités de ce viewBox (1600 × 740) :

    élément              camp haut (adverse)        camp bas (joueur)
    tablette créatures   288 ; 221 · 1024 × 131     285 ; 397 · 1024 × 131
    terrains             226 ; 111 ·  258 × 36      274 ; 611 ·  182 × 36
    cimetière             48 ;  41 ·  176 × 154    1389 ; 385 ·  160 × 102
    bibliothèque        1405 ;  30 ·  160 × 161    1405 ; 511 ·  160 × 190
    portrait (centre)    800 ; 104                  149 ; 619
    main                        —                   480 ; 574 ·  704 × 159
    socle fin de tour           —                  1126 ; 370 ·  168 ×  53

  POURQUOI preserveAspectRatio="none"
  Le fond est étiré par `background-size: 100% 100%` et le conteneur suit le
  ratio de l'écran (1,78 sur un 16:9 jusqu'à 2,33 sur un 21:9). Sans cet
  attribut, la valeur par défaut « meet » réduit l'art et le centre, alors que
  les zones du jeu — positionnées en pourcentages — ne bougent pas : l'art se
  désaligne sur tout téléphone dont le ratio n'est pas 2,16. Avec « none »,
  l'art et les zones subissent la même transformation, donc l'alignement tient
  partout, sans bandes noires. En contrepartie le décor doit tolérer un
  étirement de ±10 %, d'où des rectangles arrondis, des losanges et des
  dégradés plutôt que des cercles fins isolés.

  DEUX RÈGLES DE FOND
  1. Aucun texte : réduit à ~0,53 x il est illisible, et il serait recouvert
     par le contenu du jeu (le cimetière affiche la carte du dessus, la rangée
     de terrains affiche les cartes de terrain).
  2. Aucune case de créature fixe : les créatures sont centrées en flex, donc
     sept cases dessinées se désalignent dès qu'il y en a moins de sept. On
     dessine une tablette continue, juste quel que soit leur nombre.

  PERFORMANCE : aucun filtre SVG (feGaussianBlur est coûteux au rendu). Les
  halos passent par des dégradés radiaux, nets à petite taille.
-->
<defs>
  <linearGradient id="or" x1="0" y1="0" x2=".4" y2="1">
    <stop offset="0" stop-color="#3b1b07"/>
    <stop offset=".18" stop-color="#e6bb62"/>
    <stop offset=".38" stop-color="#7d4413"/>
    <stop offset=".62" stop-color="#f4d488"/>
    <stop offset=".82" stop-color="#8c4b19"/>
    <stop offset="1" stop-color="#2a1004"/>
  </linearGradient>
  <linearGradient id="orFin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4d488" stop-opacity=".95"/>
    <stop offset="1" stop-color="#8a5418" stop-opacity=".6"/>
  </linearGradient>
  <linearGradient id="orLigne" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a5418" stop-opacity="0"/>
    <stop offset=".14" stop-color="#e6bb62"/>
    <stop offset=".5" stop-color="#f4d488"/>
    <stop offset=".86" stop-color="#e6bb62"/>
    <stop offset="1" stop-color="#8a5418" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lueur" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f4d488" stop-opacity="0"/>
    <stop offset=".5" stop-color="#f4d488" stop-opacity=".45"/>
    <stop offset="1" stop-color="#f4d488" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="feutreFoe" cx=".5" cy="-.02" r="1.05">
    <stop offset="0" stop-color="#5b2168"/>
    <stop offset=".45" stop-color="#2c1033"/>
    <stop offset="1" stop-color="#120716"/>
  </radialGradient>
  <radialGradient id="feutreAlly" cx=".5" cy="1.02" r="1.05">
    <stop offset="0" stop-color="#17558f"/>
    <stop offset=".45" stop-color="#0a2846"/>
    <stop offset="1" stop-color="#050f1e"/>
  </radialGradient>

  <!-- Creux d'une zone : ombre portée en haut, lumière rasante en bas. -->
  <linearGradient id="creuxFoe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05030a" stop-opacity=".88"/>
    <stop offset=".55" stop-color="#1c0c22" stop-opacity=".52"/>
    <stop offset="1" stop-color="#431750" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="creuxAlly" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#02050b" stop-opacity=".88"/>
    <stop offset=".55" stop-color="#0a2038" stop-opacity=".52"/>
    <stop offset="1" stop-color="#0d3a6a" stop-opacity=".26"/>
  </linearGradient>

  <!-- Tablette de jeu : bords sombres, centre éclairé. -->
  <linearGradient id="tableFoe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#08040c" stop-opacity=".62"/>
    <stop offset=".5" stop-color="#3a1444" stop-opacity=".2"/>
    <stop offset="1" stop-color="#08040c" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="tableAlly" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04080f" stop-opacity=".62"/>
    <stop offset=".5" stop-color="#0f3f6d" stop-opacity=".2"/>
    <stop offset="1" stop-color="#04080f" stop-opacity=".5"/>
  </linearGradient>

  <radialGradient id="portailFoe">
    <stop offset="0" stop-color="#f5c8ff" stop-opacity=".92"/>
    <stop offset=".16" stop-color="#a03fe0" stop-opacity=".82"/>
    <stop offset=".55" stop-color="#33064f" stop-opacity=".7"/>
    <stop offset="1" stop-color="#120020" stop-opacity=".5"/>
  </radialGradient>
  <radialGradient id="portailAlly">
    <stop offset="0" stop-color="#cfe9ff" stop-opacity=".92"/>
    <stop offset=".16" stop-color="#2f8bff" stop-opacity=".82"/>
    <stop offset=".55" stop-color="#062a63" stop-opacity=".7"/>
    <stop offset="1" stop-color="#001028" stop-opacity=".5"/>
  </radialGradient>

  <linearGradient id="puitsMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b111c" stop-opacity=".3"/>
    <stop offset=".48" stop-color="#08070c" stop-opacity=".68"/>
    <stop offset="1" stop-color="#020205" stop-opacity=".94"/>
  </linearGradient>

  <radialGradient id="vignette" cx=".5" cy=".5" r=".76">
    <stop offset=".52" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".6"/>
  </radialGradient>

  <pattern id="grain" width="96" height="96" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="17" r="1.1" fill="#fff" opacity=".05"/>
    <circle cx="63" cy="29" r=".9" fill="#fff" opacity=".055"/>
    <circle cx="82" cy="74" r=".8" fill="#fff" opacity=".045"/>
    <circle cx="34" cy="85" r="1" fill="#fff" opacity=".04"/>
    <path d="M0 52Q26 38 54 55T96 49" fill="none" stroke="#fff" stroke-opacity=".018"/>
    <path d="M18 0Q34 32 20 62T36 96" fill="none" stroke="#fff" stroke-opacity=".014"/>
  </pattern>

  <!-- Sceau arcanique en losanges : il s'étire sans trahir la déformation,
       contrairement à des cercles concentriques. Défini en <g> et non en
       <symbol viewBox> : un <use> de symbole sans width/height se
       redimensionnerait à tout le canvas. -->
  <g id="sceau" fill="none">
    <rect x="-150" y="-64" width="300" height="128" rx="52"/>
    <rect x="-112" y="-48" width="224" height="96" rx="40"/>
    <rect x="-58" y="-26" width="116" height="52" rx="22"/>
    <path d="M0-64 150 0 0 64-150 0Z"/>
    <path d="M0-48 112 0 0 48-112 0Z"/>
    <path d="M-150 0H-112M112 0H150"/>
    <path d="M-104-44 104 44M104-44-104 44" stroke-opacity=".45"/>
  </g>

  <!-- Rivet en losange : silhouette franche même étirée. -->
  <g id="rivet">
    <path d="M0-5 5 0 0 5-5 0Z" fill="#1d1006" stroke="url(#orFin)" stroke-width="1.5"/>
    <path d="M0-1.8 1.8 0 0 1.8-1.8 0Z" fill="#f4d488" opacity=".9"/>
  </g>

  <clipPath id="interieur"><rect x="12" y="12" width="1576" height="716" rx="16"/></clipPath>
</defs>

<!-- ======================== SURFACES DES DEUX CAMPS ======================== -->
<g clip-path="url(#interieur)">
  <rect x="12" y="12" width="1576" height="358" fill="url(#feutreFoe)"/>
  <rect x="12" y="370" width="1576" height="358" fill="url(#feutreAlly)"/>

  <!-- Rais de lumière : profondeur du feutre. -->
  <g opacity=".13">
    <path d="M300 12H560L250 728H60Z" fill="#c68bff"/>
    <path d="M1180 12H1420L1560 728H1330Z" fill="#6fb6ff"/>
  </g>

  <!-- Sceaux centrés sur les tablettes de créatures (y 287 et 462). -->
  <use href="#sceau" x="800" y="287" stroke="#a8804a" stroke-opacity=".22" stroke-width="1.5"/>
  <use href="#sceau" x="797" y="462" stroke="#7ba8d8" stroke-opacity=".22" stroke-width="1.5"/>

  <rect x="12" y="12" width="1576" height="716" fill="url(#grain)"/>

  <!-- Poussière magique, cantonnée aux espaces restés libres. -->
  <g fill="#d9a6ff" opacity=".5">
    <circle cx="620" cy="46" r="1.6"/><circle cx="1000" cy="40" r="1.3"/>
    <circle cx="1340" cy="240" r="1.5"/><circle cx="250" cy="238" r="1.4"/>
    <circle cx="1080" cy="180" r="1.2"/><circle cx="520" cy="180" r="1.3"/>
  </g>
  <g fill="#a8d8ff" opacity=".45">
    <circle cx="330" cy="700" r="1.5"/><circle cx="1240" cy="700" r="1.3"/>
    <circle cx="1350" cy="440" r="1.4"/><circle cx="120" cy="450" r="1.3"/>
    <circle cx="640" cy="560" r="1.2"/><circle cx="1010" cy="556" r="1.3"/>
  </g>

  <rect x="12" y="12" width="1576" height="716" fill="url(#vignette)"/>
</g>

<!-- ============ TABLETTES DE CRÉATURES (alignées sur .board-row) ============
     Tablette continue : reste juste quel que soit le nombre de créatures,
     contrairement à sept cases dessinées. -->
<g id="tablettes">
  <g>
    <rect x="285" y="212" width="1024" height="131" rx="12" fill="url(#tableFoe)"/>
    <rect x="285" y="212" width="1024" height="131" rx="12" fill="none" stroke="#0a0510" stroke-width="4"/>
    <rect x="287.5" y="214.5" width="1019" height="126" rx="10" fill="none" stroke="url(#orFin)" stroke-width="2"/>
    <path d="M342 216H1252" stroke="url(#lueur)" stroke-width="1.6"/>
    <path d="M342 339H1252" stroke="url(#lueur)" stroke-width="1.2" stroke-opacity=".6"/>
    <use href="#rivet" x="297" y="224"/><use href="#rivet" x="1297" y="224"/>
    <use href="#rivet" x="297" y="331"/><use href="#rivet" x="1297" y="331"/>
  </g>
  <g>
    <rect x="285" y="397" width="1024" height="131" rx="12" fill="url(#tableAlly)"/>
    <rect x="285" y="397" width="1024" height="131" rx="12" fill="none" stroke="#050a12" stroke-width="4"/>
    <rect x="287.5" y="399.5" width="1019" height="126" rx="10" fill="none" stroke="url(#orFin)" stroke-width="2"/>
    <path d="M342 401H1252" stroke="url(#lueur)" stroke-width="1.6"/>
    <path d="M342 524H1252" stroke="url(#lueur)" stroke-width="1.2" stroke-opacity=".6"/>
    <use href="#rivet" x="297" y="409"/><use href="#rivet" x="1297" y="409"/>
    <use href="#rivet" x="297" y="516"/><use href="#rivet" x="1297" y="516"/>
  </g>
</g>

<!-- ================= TERRAINS (alignés sur .land-row) ================= -->
<g id="terrains">
  <g>
    <rect x="45" y="246" width="224" height="118" rx="10" fill="url(#creuxFoe)"/>
    <rect x="45" y="246" width="224" height="118" rx="10" fill="none" stroke="#0a0510" stroke-width="3"/>
    <rect x="47" y="248" width="220" height="114" rx="8" fill="none" stroke="url(#orFin)" stroke-width="1.6"/>
  </g>
  <g>
    <rect x="45" y="376" width="224" height="118" rx="10" fill="url(#creuxAlly)"/>
    <rect x="45" y="376" width="224" height="118" rx="10" fill="none" stroke="#050a12" stroke-width="3"/>
    <rect x="47" y="378" width="220" height="114" rx="8" fill="none" stroke="url(#orFin)" stroke-width="1.6"/>
  </g>
</g>

<!-- ============== CIMETIÈRES ET BIBLIOTHÈQUES (piles de cartes) ============== -->
<g id="piles">
  <!-- Cimetière adverse : 1389 ; 253 · 160 × 102 -->
  <!-- Miroir exact du cimetière joueur (740 - 385 - 102 = 253). Il était
       dessiné à gauche (48 ; 41), héritage d'une disposition où les piles
       adverses occupaient ce coin : le DOM les place désormais à droite
       pour les deux camps, ce cadre restait donc vide. -->
  <g>
    <rect x="1405" y="253" width="160" height="102" rx="9" fill="url(#creuxFoe)"/>
    <rect x="1405" y="253" width="160" height="102" rx="9" fill="none" stroke="#0a0510" stroke-width="4"/>
    <rect x="1407.5" y="255.5" width="155" height="97" rx="7" fill="none" stroke="url(#orFin)" stroke-width="2"/>
    <path d="M1407 270 1424 253M1546 253l17 17M1407 338l17 17m121 0 17-17" fill="none" stroke="#e2b85e" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <!-- Bibliothèque adverse : 1405 ; 39 · 160 × 190 (miroir de 511 ; 190) -->
  <g>
    <rect x="1405" y="39" width="160" height="190" rx="9" fill="url(#creuxFoe)"/>
    <rect x="1405" y="39" width="160" height="190" rx="9" fill="none" stroke="#0a0510" stroke-width="4"/>
    <rect x="1407.5" y="41.5" width="155" height="185" rx="7" fill="none" stroke="url(#orFin)" stroke-width="2"/>
    <path d="M1407 58 1424 41M1546 41l17 17M1407 210l17 17m121 0 17-17" fill="none" stroke="#e2b85e" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <!-- Cimetière joueur : 1389 ; 385 · 160 × 102 -->
  <g>
    <rect x="1405" y="385" width="160" height="102" rx="9" fill="url(#creuxAlly)"/>
    <rect x="1405" y="385" width="160" height="102" rx="9" fill="none" stroke="#050a12" stroke-width="4"/>
    <rect x="1407.5" y="387.5" width="155" height="97" rx="7" fill="none" stroke="url(#orFin)" stroke-width="2"/>
    <path d="M1407 402 1424 385M1546 385l17 17M1407 470l17 17m121 0 17-17" fill="none" stroke="#e2b85e" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <!-- Bibliothèque joueur : 1405 ; 511 · 160 × 190 -->
  <g>
    <rect x="1405" y="511" width="160" height="190" rx="9" fill="url(#creuxAlly)"/>
    <rect x="1405" y="511" width="160" height="190" rx="9" fill="none" stroke="#050a12" stroke-width="4"/>
    <rect x="1407.5" y="513.5" width="155" height="185" rx="7" fill="none" stroke="url(#orFin)" stroke-width="2"/>
    <path d="M1407 530 1424 513M1546 513l17 17M1407 682l17 17m121 0 17-17" fill="none" stroke="#e2b85e" stroke-opacity=".6" stroke-width="2"/>
  </g>
</g>

<!-- ===================== PORTAILS DE COMMANDANT =====================
     Centrés sur .commander-portrait : (149 ; 121) en haut, (149 ; 619) en bas.
     Même axe X pour les deux camps, et 121 = 740 - 619 : miroir exact.
     Cercles acceptés ici : ils encadrent un portrait rond, qui subit
     exactement la même déformation qu'eux. -->
<g id="portails">
  <g transform="translate(149 133)">
    <circle r="78" fill="#0b0510" stroke="#1a0d05" stroke-width="12"/>
    <circle r="70" fill="none" stroke="url(#or)" stroke-width="6"/>
    <circle r="62" fill="url(#portailFoe)"/>
    <circle r="62" fill="none" stroke="#a03fe0" stroke-width="2.5" opacity=".75"/>
    <circle r="43" fill="none" stroke="#e2a8ff" stroke-opacity=".28"/>
  </g>
  <g transform="translate(149 607)">
    <circle r="78" fill="#04080f" stroke="#1a0d05" stroke-width="12"/>
    <circle r="70" fill="none" stroke="url(#or)" stroke-width="6"/>
    <circle r="62" fill="url(#portailAlly)"/>
    <circle r="62" fill="none" stroke="#2f8bff" stroke-width="2.5" opacity=".75"/>
    <circle r="43" fill="none" stroke="#a8d8ff" stroke-opacity=".28"/>
  </g>
</g>

<!-- ============================ LIGNE CENTRALE ============================ -->
<!-- Interrompue à droite : le bouton HTML de fin de tour occupe 1126 → 1294. -->
<g id="ligne-centrale">
  <!-- Le bouton HTML occupe 1129 → 1313. Le trait s'arrête et reprend à
       12 unités de ses bords, de part et d'autre : l'interruption est
       symétrique au lieu de coller le bouton à droite. -->
  <path d="M30 370H1117" stroke="#0a0510" stroke-width="12"/>
  <path d="M30 367H1117" stroke="url(#orLigne)" stroke-width="3.2"/>
  <path d="M30 373.5H1117" stroke="#3f1f0a" stroke-opacity=".85" stroke-width="1.8"/>
  <path d="M1325 370H1570" stroke="#0a0510" stroke-width="12"/>
  <path d="M1325 367H1570" stroke="url(#orLigne)" stroke-width="3.2"/>
  <g transform="translate(560 370)">
    <path d="M0-14 14 0 0 14-14 0Z" fill="#160726" stroke="url(#or)" stroke-width="3.2"/>
    <path d="M0-6.5 6.5 0 0 6.5-6.5 0Z" fill="#8a2fd6" opacity=".8"/>
  </g>
  <g transform="translate(1010 370)">
    <path d="M0-14 14 0 0 14-14 0Z" fill="#160726" stroke="url(#or)" stroke-width="3.2"/>
    <path d="M0-6.5 6.5 0 0 6.5-6.5 0Z" fill="#2f8bff" opacity=".8"/>
  </g>
</g>

<!-- ================== MAIN ET SOCLE DU BOUTON DE FIN DE TOUR ==================
     Berceau de la main : 480 ; 574 · 704 × 159 (déborde volontairement en bas).
     Socle : 1126 ; 370 · 168 × 53, sous le bouton HTML #end-turn. -->
<g id="main">
  <path d="M480 740V604Q480 578 510 576H1154Q1184 578 1184 604V740Z" fill="url(#puitsMain)" stroke="#6f4519" stroke-width="3"/>
  <path d="M500 740V618Q500 594 528 592H1136Q1164 594 1164 618V740" fill="none" stroke="#d8a84a" stroke-opacity=".3" stroke-width="2"/>
  <path d="M530 716Q832 652 1134 716" fill="none" stroke="url(#orFin)" stroke-width="2.6" stroke-opacity=".4"/>
</g>
<!-- Pas de socle dessiné sous « Fin du tour » : le bouton HTML porte déjà son
     propre fond, et le socle (1127 ; 374) débordait sous lui de 25 unités,
     d'où le rectangle sombre visible en dessous. -->

<!-- ========================= CADRE EXTÉRIEUR =========================
     Maintenu sous 28 unités : la Bibliothèque adverse commence à y = 30. -->
<rect x="6" y="6" width="1588" height="728" rx="16" fill="none" stroke="#1a0d05" stroke-width="12"/>
<rect x="14" y="14" width="1572" height="712" rx="12" fill="none" stroke="url(#or)" stroke-width="6"/>
<rect x="19" y="19" width="1562" height="702" rx="10" fill="none" stroke="#3a1c08" stroke-width="2.6"/>
<rect x="22" y="22" width="1556" height="696" rx="9" fill="none" stroke="#bf8330" stroke-opacity=".7" stroke-width="1.2"/>

<!-- Filigranes d'angle, confinés aux angles pour ne rien recouvrir. -->
<g fill="none" stroke="url(#orFin)" stroke-width="2.4" stroke-linecap="round">
  <path d="M26 62Q26 26 62 26M26 84Q36 36 84 26"/>
  <path d="M1574 62Q1574 26 1538 26M1574 84Q1564 36 1516 26"/>
  <path d="M26 678Q26 714 62 714M26 656Q36 704 84 714"/>
  <path d="M1574 678Q1574 714 1538 714M1574 656Q1564 704 1516 714"/>
</g>
</svg>
