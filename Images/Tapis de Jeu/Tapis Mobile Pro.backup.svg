      <use href="#slot-rune" x="911" y="236" width="78" height="78"/><use href="#slot-rune" x="1061" y="236" width="78" height="78"/>
      <use href="#slot-rune" x="1211" y="236" width="78" height="78"/>
      <use href="#slot-rune" x="311" y="436" width="78" height="78"/><use href="#slot-rune" x="461" y="436" width="78" height="78"/>
      <use href="#slot-rune" x="611" y="436" width="78" height="78"/><use href="#slot-rune" x="761" y="436" width="78" height="78"/>
      <use href="#slot-rune" x="911" y="436" width="78" height="78"/><use href="#slot-rune" x="1061" y="436" width="78" height="78"/>
      <use href="#slot-rune" x="1211" y="436" width="78" height="78"/>
