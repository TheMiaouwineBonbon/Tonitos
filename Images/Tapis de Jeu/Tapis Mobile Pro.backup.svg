<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" role="img" aria-labelledby="title description">
  <title id="title">Tapis mobile Spellaho</title>
  <desc id="description">Tapis fantasy compact pour smartphone paysage, avec deux camps, sept emplacements de creatures et une main centrale.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#3d1d07"/>
      <stop offset=".18" stop-color="#e8bd63"/>
      <stop offset=".36" stop-color="#8a5418"/>
      <stop offset=".58" stop-color="#f6d891"/>
      <stop offset=".78" stop-color="#7c4713"/>
      <stop offset="1" stop-color="#2c1405"/>
    </linearGradient>
    <linearGradient id="gold-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d891" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8a5418" stop-opacity=".65"/>
    </linearGradient>
    <radialGradient id="foe-felt" cx=".5" cy="-.05" r="1.05">
      <stop offset="0" stop-color="#5b2168"/>
      <stop offset=".45" stop-color="#2c1033"/>
      <stop offset="1" stop-color="#120716"/>
    </radialGradient>
    <radialGradient id="ally-felt" cx=".5" cy="1.05" r="1.05">
      <stop offset="0" stop-color="#17558f"/>
      <stop offset=".45" stop-color="#0a2846"/>
      <stop offset="1" stop-color="#050f1e"/>
    </radialGradient>
    <radialGradient id="foe-portal">
      <stop offset="0" stop-color="#f5c8ff"/>
      <stop offset=".14" stop-color="#a03fe0"/>
      <stop offset=".52" stop-color="#33064f"/>
      <stop offset="1" stop-color="#120020" stop-opacity=".65"/>
    </radialGradient>
    <radialGradient id="ally-portal">
      <stop offset="0" stop-color="#cfe9ff"/>
      <stop offset=".14" stop-color="#2f8bff"/>
      <stop offset=".52" stop-color="#062a63"/>
      <stop offset="1" stop-color="#001028" stop-opacity=".65"/>
    </radialGradient>
    <linearGradient id="slot-foe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08040c" stop-opacity=".72"/>
      <stop offset="1" stop-color="#431750" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="slot-ally" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04080f" stop-opacity=".72"/>
      <stop offset="1" stop-color="#0d3a6a" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="hand-well" x1="0" y1="0" x2="0" y2="1">
