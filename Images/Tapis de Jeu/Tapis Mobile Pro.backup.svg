      <rect x="583" y="196" width="134" height="158" rx="10"/><rect x="733" y="196" width="134" height="158" rx="10"/>
      <rect x="883" y="196" width="134" height="158" rx="10"/><rect x="1033" y="196" width="134" height="158" rx="10"/>
      <rect x="1183" y="196" width="134" height="158" rx="10"/>
