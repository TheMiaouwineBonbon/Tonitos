      <rect x="583" y="396" width="134" height="158" rx="10"/><rect x="733" y="396" width="134" height="158" rx="10"/>
      <rect x="883" y="396" width="134" height="158" rx="10"/><rect x="1033" y="396" width="134" height="158" rx="10"/>
