    <rect x="20" y="20" width="1560" height="700" rx="18" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <rect x="28" y="28" width="1544" height="684" rx="13" fill="none" stroke="#3a1c08" stroke-width="4"/>
    <rect x="33" y="33" width="1534" height="674" rx="11" fill="none" stroke="#bf8330" stroke-width="1.6"/>
    <g fill="none" stroke="url(#gold-soft)" stroke-width="3" stroke-linecap="round">
