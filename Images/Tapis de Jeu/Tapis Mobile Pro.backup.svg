  <g id="hand-lane">
    <path d="M520 724V606Q520 582 548 580H1028Q1056 582 1056 606V724Z" fill="url(#hand-well)" stroke="#6f4519" stroke-width="3"/>
    <path d="M538 714V620Q538 598 562 596H1014Q1038 598 1038 620V714" fill="none" stroke="#d8a84a" stroke-opacity=".32" stroke-width="2"/>
    <path d="M566 716Q788 654 1010 716" fill="none" stroke="url(#gold-soft)" stroke-width="3" stroke-opacity=".42"/>
